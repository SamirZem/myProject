name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ubuntu-latest runners ship with an Android SDK pre-installed under
      # ANDROID_HOME, licenses already accepted - AGP downloads any missing
      # platform/build-tools packages itself during the Gradle build below.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: temps-ecran-pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Also publish as a raw (unzipped) release asset so it can be downloaded
      # and installed directly from a phone browser - workflow artifacts are
      # always zipped, which is awkward on Android.
      - name: Publish APK to "latest-debug-apk" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug-apk
          name: Dernier APK debug (${{ github.ref_name }})
          body: |
            APK debug généré automatiquement depuis la branche `${{ github.ref_name }}`
            (commit ${{ github.sha }}). Non destiné au Play Store - à installer
            directement sur l'appareil ("sources inconnues" à autoriser).
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
