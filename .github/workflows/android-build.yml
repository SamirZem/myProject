name: Android build

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android SDK packages
        # ubuntu-latest runners already ship an Android SDK; we just need to make sure the
        # exact platform/build-tools this project targets are installed. The cmdline-tools
        # subdirectory layout has changed across runner-image versions, so search for the
        # sdkmanager binary instead of hardcoding its path.
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT" -maxdepth 6 -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Could not find sdkmanager under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 3 2>/dev/null
            exit 1
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run analyzer unit tests
        run: ./gradlew :analyzer:test --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clash-analyzer-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to apk-drop branch
        # actions/upload-artifact publishes to Azure Blob storage, which isn't reachable from
        # every environment that develops this repo. Also push the APK to a throwaway branch
        # via plain git, so it can be retrieved with `git fetch` instead.
        working-directory: .
        run: |
          git config user.name "clash-analyzer-ci"
          git config user.email "ci@users.noreply.github.com"
          APK_PATH=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          git checkout --orphan apk-drop
          git rm -rf --cached . > /dev/null
          mkdir -p artifacts
          cp "$APK_PATH" artifacts/clash-analyzer-debug.apk
          git add artifacts/clash-analyzer-debug.apk
          git commit -m "APK build from ${{ github.sha }}"
          git push origin HEAD:apk-drop --force
